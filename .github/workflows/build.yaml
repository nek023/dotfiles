name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zsh luajit

      - name: Lint
        run: make lint

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stow and zsh
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install stow
          else
            sudo apt-get update && sudo apt-get install -y stow zsh
          fi

      - name: Test stow link/unlink against a clean HOME
        run: |
          export HOME=$(mktemp -d)
          make list
          make link
          make list
          make unlink
