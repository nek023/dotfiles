name: Build

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  stow:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stow
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install stow
          else
            sudo apt-get update && sudo apt-get install -y stow
          fi

      - name: Test stow link/unlink against a clean HOME
        run: |
          HOME=$(mktemp -d)
          export HOME
          make list
          make link
          make list
          make unlink

  nix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    env:
      # The flake reads this to name the user, and runners do not always set it.
      USER: runner

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Resolve the configuration
        run: make check
