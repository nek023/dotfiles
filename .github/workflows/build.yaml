name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zsh luajit

      - name: Lint
        run: make lint

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stow and zsh
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install stow
          else
            sudo apt-get update && sudo apt-get install -y stow zsh
          fi

      - name: Test stow link/unlink against a clean HOME
        run: |
          export HOME=$(mktemp -d)
          make list
          make link
          make list
          make unlink

      - name: Boot zsh against a clean HOME
        env:
          TERM: xterm-256color
        run: |
          export HOME=$(mktemp -d)
          make link
          output=$(zsh -ilc 'echo ZSH_BOOT_OK' 2>&1)
          printf '%s\n' "${output}"
          grep -q ZSH_BOOT_OK <<< "${output}"
          ! grep -iE 'error|failed|no such file|not found' <<< "${output}"
